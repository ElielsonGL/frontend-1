<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <h1>Formulários</h1>
    <form>
        <div>
            <label for="nome">Nome:</label>
            <input type="text" name="nomecompleto" placeholder="Insira seu nome completo" required />

        <!-- Input Number -->
            <label for="certificados"> Quantos certificados você possui? </label>
            <input type="number" name="certificados" />

        <!-- Input E-mail -->
            <label for="emailinserido"> Insira o seu e-mail:</label>
            <input type="email" name="emailinserido" />

        <!-- Input Senha -->
           <label for="senha">Insira a senha:</label>
           <input type="password" name="senha" />
           
        <!-- Textarea -->
            <label for="feedback">Descreva seu feedback sobre o site:</label>
            <textarea name="feedback"></textarea>

        <!-- Input de Data -->
            <label for="datadenascimento">Data de Nascimento:</label>
            <input type="date" name="datadenascimento" />

        <!-- Input file -->
            <label for="arquivo">Insira o seu currículo em PDF</label>
            <input type="file" value="Enviar" />

        <!-- Input Radio - somente 1(um) seleção-->
            <label for="genero">Qual o seu gênero:</label>
            <div class="radio">
              <input type="radio" value="Feminino" name="genero">
              <label for="Feminino">Feminino</label> 
            </div>
            
            <div class="radio">
                <input type="radio" value="Masculino" name="genero">
                <label for="Masculino">Masculino</label>
            </div>

            <div class="radio">
                <input type="radio" value="NaoBinario" name="genero">
                <label for="NaoBinario">Não Binário</label>
            </div>
            
            <div class="radio">
                <input type="radio" value="NãoInformou" name="genero">
                <label for="NaoInformou">Prefiro não infomar</label>
            </div>

            <!-- Input Checkbox / uma  ou mais opções -->
             <div>
                <label for="linguasestrangeiras">Quais linguas você pretende estudar?:</label>

             <div class="radio">
                <input type="checkbox" name="linguasestrangeiras" value="ingles">
                <label for="ingles">Inglês</label>
             </div>   

             <div class="radio">
                <input type="checkbox" name="linguasestrangeiras" value="espanhol">
                <label for="espanhol">Espanhol</label>
             </div>
             
             <div class="radio">
                <input type="checkbox" name="linguasestrangeiras" value="alemao">
                <label for="alemao">Alemão</label>
             </div>   

             </div>

             <!-- Select / menu suspenso -->
              <div>
                <label for="cidade">Selecione sua cidade</label>
                <select name="cidade">
                    <option value="Osasco">Osasco</option>
                    <option value="São Paulo" selected>São Paulo</option>
                    <option value="Taboão">Taboão da Serra</option>
                </select>
            
              </div>

        </div>

        <!-- Limpando/Resetando o formulário -->
         <input type="reset" value="Limpar" />

        <!-- submit botão -->
         <input type="submit" value="Enviar" />
    </form>
</body>
</html>
